<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Site Favicon">
  <!-- Transparent background; five grey squares in a cross-diagonal layout -->
  <g fill="#bdbdbd">
    <!-- top-left -->
    <rect x="64" y="64" width="128" height="128"/>
    <!-- top-right -->
    <rect x="320" y="64" width="128" height="128"/>
    <!-- center -->
    <rect x="192" y="192" width="128" height="128"/>
    <!-- bottom-left -->
    <rect x="64" y="320" width="128" height="128"/>
    <!-- bottom-right -->
    <rect x="320" y="320" width="128" height="128"/>
  </g>
</svg>
